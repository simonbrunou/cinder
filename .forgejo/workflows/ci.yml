# Runs on the self-hosted Forgejo (git.sbrn.eu), the source of truth; the GitHub
# repository is a push mirror and runs no CI (release.yml still runs there, on
# mirrored tags). Differences from the GitHub-hosted version:
# - BEAM jobs say `runs-on: ubuntu-26.04`: for `ubuntu-latest` the runner sets
#   ImageOS=ubuntu20, and setup-beam finds no OTP 29 build for Ubuntu 20.04;
# - artifacts use Forgejo's upload-artifact fork (actions/upload-artifact v4+
#   refuses to run off github.com);
# - the container job drives the runner CT's Docker daemon (see that job);
# - no `permissions:` block: Forgejo ignores the key and warns about it on
#   every run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ponytail: single version matched to dev; add a matrix here if you ever
      # support older Elixir/OTP than what you build on.
      # Exact versions, the same as ELIXIR_VERSION/OTP_VERSION in the Dockerfile, so the suite
      # runs on the toolchain the release is built with (floating "29"/"1.20" once let CI run
      # newer versions than production). Bump them together:
      # test/code_health/beam_version_pins_test.exs fails `mix test` when any setup-beam step
      # differs from the Dockerfile.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"

      # Dependency sources, shared with the dependency-audit job (same key).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-

      # Compiled dependencies: building them took 1m45s of this job (2026-10-12). Exact key
      # only, no restore-keys: a mix.lock change rebuilds every dependency rather than
      # restoring an older build. Cinder's own beams (_build/test/lib/cinder) are never
      # cached, so the app still compiles from scratch every run (no incremental-compile
      # false-greens). The `/*` matters: an exclusion only drops a path the glob matched
      # itself, so with a bare `_build/test/lib` the whole directory, Cinder included, was
      # archived (observed in this PR's first runs).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deps-build
        with:
          path: |
            _build/test/lib/*
            !_build/test/lib/cinder
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-deps-build-test-${{ hashFiles('**/mix.lock') }}

      # #867: on a miss, a precompiled NIF download from GitHub can fail on OTP 29 :httpc's
      # header cap (docs/agents/ci.md "Dependency rebuild"). elixir_make then builds the NIF
      # from source: exqlite needs only the image's C compiler, lazy_html also needs cmake.
      # 3 tries 30 s apart for an Ubuntu mirror caught mid-sync, as the container job's
      # `playwright install-deps` has.
      - if: steps.deps-build.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "apt-get update failed (attempt $attempt of 3); retrying in 30 s"
            sleep 30
          done
          sudo apt-get install -y --no-install-recommends cmake

      - run: mix deps.get

      # `mix test` is the project alias: compile --warnings-as-errors,
      # format --check-formatted, credo --strict, ecto create/migrate, test --warnings-as-errors.
      #
      # #396: a flake sighting's failure detail is otherwise lost — a local `mix test --failed`
      # rerun can pass and clear the manifest before anyone captures the diff. `tee` keeps the
      # full output on disk regardless of exit status. forgejo-runner v13.2.1 runs a
      # `shell: bash` step as `bash --noprofile --norc -e -o pipefail` (`shellCommand` in
      # act/runner/step_run.go), so the step fails when mix test fails, whatever tee returns,
      # and the explicit shell keeps pipefail whatever the default shell is. With no shell on
      # the step and no `defaults: run: shell:`, `interpretShell` (same file) runs a
      # `command -v bash` probe in the job container. When the probe answers `bash`, the step
      # runs the same way. When it answers `sh`, as in a container that has sh but no bash,
      # `shellCommand` runs the step as `sh -e`, without pipefail.
      # The upload below preserves it as a downloadable artifact past whatever the job log's own
      # retention does.
      - shell: bash
        run: mix test 2>&1 | tee mix-test-output.log

      - name: Upload mix test output
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: mix-test-output
          path: mix-test-output.log
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-

      # `mix deps.audit` is a task from a dependency, so Mix compiles every dependency
      # (dev env) before it runs: 2m34s of a 3-minute job (2026-10-12). Same rules as the
      # test job's build cache. A miss needs no cmake here: lazy_html is a test-only dependency.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/dev/lib/*
            !_build/dev/lib/cinder
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-deps-build-dev-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      # hex.audit = retired packages and Hex.pm security advisories (accepted ones
      # in `ignore_advisories`, mix.exs `hex/0`); deps.audit (mix_audit) = CVEs vs
      # the Elixir Security Advisory DB. Keep both. deps.audit fails open if it
      # can't reach github.com to sync advisories; the runner reaches it.
      - run: mix hex.audit
      - run: mix deps.audit

  container:
    runs-on: ubuntu-latest
    env:
      # The job drives the runner CT's Docker daemon, shared by every job on the
      # runner. Names carry the run id so two concurrent runs never collide, and the
      # attempt so a re-run never shares them with an earlier attempt of its run (#1193):
      # an attempt the runner lost runs no cleanup step and leaves its container behind,
      # and one cut off from the forge can still be running when the re-run starts, so
      # with one name per run its cleanup steps would remove the re-run's container and
      # image. Forgejo numbers run_attempt per job, not per run: re-running only this job
      # makes it 2 while `test` stays at 1.
      CINDER_IMAGE: cinder:ci-${{ github.run_id }}-${{ github.run_attempt }}
      CINDER_SMOKE_CONTAINER: cinder-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #1193: remove what earlier attempts of this run left behind, by name. The names
      # are this attempt's with its number swapped out. The image goes by tag, never by
      # ID: a push run and a pull_request run of one SHA build the same image ID.
      # `--force` would skip a missing name, but `image rm` still prints an error for it,
      # so the step checks first. `shell: bash` runs it with `-e`, so a failed `docker` call
      # fails the step, and `((...))` needs bash. test/code_health/ci_container_attempt_test.exs
      # runs this text against a stub docker.
      - name: Remove earlier attempts' container and image
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$RUN_ATTEMPT" in
            '' | 0* | *[!0-9]*)
              echo "::error::github.run_attempt is '$RUN_ATTEMPT', not a positive integer, so the container and image names do not tell this run's attempts apart"
              exit 1
              ;;
          esac
          container_base=${CINDER_SMOKE_CONTAINER%-"$RUN_ATTEMPT"}
          image_base=${CINDER_IMAGE%-"$RUN_ATTEMPT"}
          if [ "$container_base" = "$CINDER_SMOKE_CONTAINER" ] || [ "$image_base" = "$CINDER_IMAGE" ]; then
            echo "::error::CINDER_SMOKE_CONTAINER ($CINDER_SMOKE_CONTAINER) and CINDER_IMAGE ($CINDER_IMAGE) must both end in -$RUN_ATTEMPT"
            exit 1
          fi
          if [ "$RUN_ATTEMPT" = 1 ]; then
            echo "This is attempt 1: no earlier attempt to clean up"
          fi
          for ((n = 1; n < RUN_ATTEMPT; n++)); do
            container="$container_base-$n"
            image="$image_base-$n"
            found=$(docker ps --all --quiet --filter "name=^/$container\$")
            if [ -n "$found" ]; then
              docker rm --force "$container" >/dev/null
              container_state=removed
            else
              container_state=absent
            fi
            found=$(docker images --quiet "$image")
            if [ -n "$found" ]; then
              docker image rm --force "$image" >/dev/null
              image_state=removed
            else
              image_state=absent
            fi
            echo "Attempt $n: container $container $container_state, image $image $image_state"
          done

      - run: docker build --check .
      - run: docker build -t "$CINDER_IMAGE" .

      - name: Boot a fresh instance
        env:
          CINDER_SMOKE_BOOTSTRAP_TOKEN: ci-only-not-a-real-bootstrap-token
        # The container joins this job container's network namespace instead of
        # publishing a port: a `-p 127.0.0.1:4000:4000` publish would land on the
        # runner CT, not here. Sharing the namespace keeps 127.0.0.1:4000 local.
        run: |
          echo "Booting container $CINDER_SMOKE_CONTAINER from image $CINDER_IMAGE"
          docker run --detach --name "$CINDER_SMOKE_CONTAINER" --network "container:$(hostname)" \
            -e SECRET_KEY_BASE=ci-only-not-a-real-secret-key-base-0123456789abcdefghijklmnopqrstuvwxyz \
            -e DATABASE_PATH=/data/cinder.db \
            -e PHX_HOST=127.0.0.1 \
            -e CINDER_BOOTSTRAP_TOKEN="$CINDER_SMOKE_BOOTSTRAP_TOKEN" \
            "$CINDER_IMAGE"
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready:-false}" = true

          # The browser smoke exercises account bootstrap, not external-service setup.
          docker exec "$CINDER_SMOKE_CONTAINER" /app/bin/cinder eval \
            '{:ok, _} = Application.ensure_all_started(:cinder); Cinder.Settings.mark_setup_complete()'

          python3 -m venv "$RUNNER_TEMP/cinder-browser-smoke"
          "$RUNNER_TEMP/cinder-browser-smoke/bin/pip" install --disable-pip-version-check playwright==1.61.0
          # Chromium's system libraries come from apt. On run 3138 an archive.ubuntu.com server
          # answered `apt-get update` with a Packages file of the wrong size ("Mirror sync in
          # progress?"), and the job's re-run passed: give apt 3 tries 30 s apart.
          for attempt in 1 2 3; do
            "$RUNNER_TEMP/cinder-browser-smoke/bin/playwright" install-deps chromium && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "playwright install-deps failed (attempt $attempt of 3); retrying in 30 s"
            sleep 30
          done
          # Playwright's own Chromium (cdn.playwright.dev), not Google Chrome from dl.google.com (#842).
          "$RUNNER_TEMP/cinder-browser-smoke/bin/playwright" install chromium

      # #1201: `Disk.exchange/2` swaps two paths outside the library roots with
      # `mv --exchange`, which the `test` job's coreutils 9.4 lacks. This step runs
      # .github/scripts/mv_exchange_check.exs in the booted node as the image's user, through
      # `rpc` because the call needs the started application. It passes only when the rpc exits
      # 0 and prints the line `MV_EXCHANGE_CHECK:ok`, and prints the rpc's output either way.
      # The here-string keeps grep off a pipe, which `-o pipefail` would fail on an early exit.
      # test/code_health/ci_mv_exchange_check_test.exs runs this text against a stub docker.
      - name: mv --exchange in the release image (#1201)
        shell: bash
        run: |
          check=$(cat .github/scripts/mv_exchange_check.exs)
          status=0
          output=$(docker exec "$CINDER_SMOKE_CONTAINER" /app/bin/cinder rpc "$check" 2>&1) || status=$?
          printf '%s\n' "$output"
          if [ "$status" != 0 ]; then
            echo "::error::bin/cinder rpc exited $status, so the mv --exchange check did not finish"
            exit 1
          fi
          if ! grep -qx 'MV_EXCHANGE_CHECK:ok' <<<"$output"; then
            echo "::error::the mv --exchange check printed no MV_EXCHANGE_CHECK:ok line"
            exit 1
          fi
          echo "Disk.exchange/2 ran mv --exchange in the release image and swapped two files"

      - name: Browser smoke
        env:
          CINDER_SMOKE_BASE_URL: http://127.0.0.1:4000
          CINDER_SMOKE_EMAIL: browser-smoke@example.invalid
          CINDER_SMOKE_PASSWORD: ci-only-browser-smoke-password
          CINDER_SMOKE_BOOTSTRAP_TOKEN: ci-only-not-a-real-bootstrap-token
        run: '"$RUNNER_TEMP/cinder-browser-smoke/bin/python" .github/scripts/browser_smoke.py'

      # #593: covers the two JS lifecycles (Kindle status-badge flare, poster-failure handling)
      # #592 added, neither of which the smoke test above touches. Drives real state changes
      # into the already-running instance via `bin/cinder rpc` (not `eval` — eval boots a
      # disconnected temporary node whose broadcasts can never reach a mounted LiveView), so a
      # real broadcast patches the real, already-open page the way #592's own author
      # hand-verified the kindle flare while writing it.
      - name: Browser JS lifecycle regression (#593)
        env:
          CINDER_SMOKE_BASE_URL: http://127.0.0.1:4000
          CINDER_SMOKE_EMAIL: browser-smoke@example.invalid
          CINDER_SMOKE_PASSWORD: ci-only-browser-smoke-password
        run: '"$RUNNER_TEMP/cinder-browser-smoke/bin/python" .github/scripts/browser_lifecycle.py'

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs "$CINDER_SMOKE_CONTAINER" || true
          docker rm --force "$CINDER_SMOKE_CONTAINER" || true

      # trivy-action's own setup step checks out aquasecurity/trivy from github.com
      # with this forge's job token, which github.com rejects. Install the same
      # Trivy version directly and tell the action to skip its setup. The release
      # tarball is pinned by sha256 (from the release's trivy_0.70.0_checksums.txt)
      # rather than piping an install script from the network into a shell.
      - name: Install Trivy
        run: |
          set -eu
          cd "$(mktemp -d)"
          curl -sfL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy

      # #835: Trivy moves on to its second DB repository only after some registry errors,
      # not after a stalled download, and its --timeout does not bound the download. On
      # 2026-10-20 mirror.gcr.io stalled for hours while ghcr.io answered. So fetch the DB
      # here, one attempt per repository under coreutils `timeout`, into the directory the
      # action points Trivy at (its cache-dir default), and scan without updating it. The
      # action's own cache stays off: restoring it after this step could swap in an older DB.
      # The Java DB is not fetched: the image ships no JARs. One that did would make the scan
      # fetch it from mirror.gcr.io first, with no bound. GITHUB_TOKEN is unset for the
      # download: Trivy sends it to ghcr.io, and this forge's job token gets DENIED there.
      - name: Download the Trivy vulnerability DB
        run: |
          for repo in ghcr.io/aquasecurity/trivy-db:2 mirror.gcr.io/aquasec/trivy-db:2; do
            if env -u GITHUB_TOKEN timeout --kill-after=10s 3m \
              trivy image --download-db-only --db-repository "$repo" \
              --cache-dir "$GITHUB_WORKSPACE/.cache/trivy"; then
              exit 0
            else
              echo "::warning::Trivy DB download from $repo failed (exit $?)"
            fi
          done
          exit 1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ env.CINDER_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # The action fails when this file is missing and prints it under "Found ignorefile".
          trivyignores: .trivyignore
          exit-code: 1

      - name: Remove the CI image
        if: always()
        run: docker image rm -f "$CINDER_IMAGE" || true
