# Cinder — self-hosted movies + TV + e-book + audiobook request / download / import.
#
# Quickstart:
#   cp .env.example .env
#   echo "SECRET_KEY_BASE=$(openssl rand -base64 48)" >> .env
#   echo "CINDER_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)" >> .env
#   mkdir -p media/{movies,tv,books,audiobooks,downloads} && sudo chown -R 65534:65534 media
#   docker compose up --build      # builds the image locally on first run
# Then open http://localhost:4000 and use the bootstrap token to create your admin. The wizard
# also asks for the e-book/audiobook library folders (e.g. /media/books, /media/audiobooks) —
# unlike the movie/TV roots below, they have no environment-variable bootstrap; type them in.
#
# The chown step matters: Cinder runs as `nobody` (uid 65534) and the ./media bind mount keeps host
# ownership, so without it the onboarding wizard can't create/write the library roots and won't
# finish (and later imports would fail with EACCES). The /data DB volume is handled by the image.

services:
  cinder:
    # `build: .` builds from this repo (works before any image is published, and is
    # what `--build` rebuilds). Once you pull a published release you can drop `build:`
    # and pin a tag, e.g.  image: ghcr.io/simonbrunou/cinder:2.0.0
    image: ghcr.io/simonbrunou/cinder:latest
    build: .
    restart: unless-stopped
    # Liveness probe. /healthz returns 503 when a background poller has wedged (its last successful
    # tick is older than 3× its interval), else 200 — details in docs/operating.md. NOTE: `docker
    # compose` only *marks* the container unhealthy on failure; it does NOT restart it (`restart:`
    # reacts to the process exiting, not to health). To get a restart-on-unhealthy, add an autoheal
    # sidecar (e.g. willfarrell/autoheal) or run under an orchestrator that acts on health.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      # Bound to localhost on purpose: claiming the first admin requires CINDER_BOOTSTRAP_TOKEN
      # below, but a fresh, unclaimed instance still shouldn't sit open on the whole network.
      # To serve the LAN, change to "4000:4000" (or front it with a reverse proxy) AFTER
      # creating your admin — and note prod redirects non-localhost HTTP to https://$PHX_HOST.
      - "127.0.0.1:4000:4000"
    environment:
      # Boot-only config — stays in env (needed before the in-app settings store is up).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (openssl rand -base64 48)}
      # One-time first-admin claim. After creating the admin, remove this line and its .env value.
      CINDER_BOOTSTRAP_TOKEN: ${CINDER_BOOTSTRAP_TOKEN:?set CINDER_BOOTSTRAP_TOKEN in .env (openssl rand -hex 32)}
      DATABASE_PATH: /data/cinder.db
      PHX_SERVER: "true"
      PORT: "4000"
      PHX_HOST: ${PHX_HOST:-localhost}
      # Library roots — a separate root per kind (a media server wants Movies/Shows split). Both
      # are required; editable later in /settings (a DB value overrides this bootstrap).
      MOVIES_LIBRARY_PATH: /media/movies
      TV_LIBRARY_PATH: /media/tv
      # Optional outer HTTP Basic-auth gate (set BOTH in .env to enable) — a stopgap until
      # the admin account exists, or a second layer without a reverse proxy/VPN.
      CINDER_BASIC_AUTH_USER: ${CINDER_BASIC_AUTH_USER:-}
      CINDER_BASIC_AUTH_PASSWORD: ${CINDER_BASIC_AUTH_PASSWORD:-}
    volumes:
      - cinder_data:/data              # SQLite DB + WAL (named volume; survives recreate)
      - ${MEDIA_ROOT:-./media}:/media  # library + downloads — see the hardlink note below

# SSRF hardening (egress ACL): Cinder validates indexer-supplied URLs and magnet/tracker hosts
# against loopback/RFC1918/link-local/cloud-metadata before fetching, but a DNS-rebinding answer
# between that check and the actual connect is a residual gap (see lib/cinder/http_policy.ex). The
# real mitigation is a network egress ACL that denies the container outbound access to internal
# ranges — 127.0.0.0/8, 10/8, 172.16/12, 192.168/16, 169.254/16 (incl. 169.254.169.254 metadata).
# Compose has no native egress filter; enforce it at the host firewall, a proxy, or the orchestrator
# (e.g. a dedicated Docker network + iptables OUTPUT rules). See docs/operating.md.
#
# Everything else (TMDB / Prowlarr / qBittorrent / SABnzbd / Jellyfin / Plex) is set in the
# first-run wizard, not here — Cinder reaches them by URL (e.g. http://prowlarr:9696 when they
# share this compose network).
#
# HARDLINK REQUIREMENT: Cinder hardlinks finished downloads into the library, and a hardlink
# cannot cross filesystems. Keep the library and the download client's completed dir under one
# mount:
#   /media/movies       <- MOVIES_LIBRARY_PATH (movies import here)
#   /media/tv           <- TV_LIBRARY_PATH (episodes import here)
#   /media/books        <- typed into the wizard as the e-book library folder
#   /media/audiobooks   <- typed into the wizard as the audiobook library folder
#   /media/downloads    <- point your download client's completed dir here
#
# Example wiring (uncomment + adjust, and uncomment the matching named volumes below).
# NOTE: Cinder runs as `nobody` (uid/gid 65534). Give the download client a matching PUID/PGID
# (or a shared group with group write) or hardlinks fail with EACCES and items park
# as :import_failed.
#
#   prowlarr:
#     image: lscr.io/linuxserver/prowlarr:latest
#     restart: unless-stopped
#     environment: { PUID: "65534", PGID: "65534", TZ: "Etc/UTC" }
#     volumes: [ "prowlarr_config:/config" ]
#     ports: [ "9696:9696" ]
#
#   qbittorrent:
#     image: lscr.io/linuxserver/qbittorrent:latest
#     restart: unless-stopped
#     environment: { PUID: "65534", PGID: "65534", TZ: "Etc/UTC", WEBUI_PORT: "8080" }
#     volumes:
#       - "qbittorrent_config:/config"
#       - "${MEDIA_ROOT:-./media}:/media"   # SAME mount as cinder -> hardlinks work
#     ports: [ "8080:8080" ]
#
#   jellyfin:
#     image: lscr.io/linuxserver/jellyfin:latest
#     restart: unless-stopped
#     environment: { PUID: "65534", PGID: "65534", TZ: "Etc/UTC" }
#     volumes:
#       - "jellyfin_config:/config"
#       - "${MEDIA_ROOT:-./media}:/media:ro"
#     ports: [ "8096:8096" ]

volumes:
  cinder_data:
  # prowlarr_config:
  # qbittorrent_config:
  # jellyfin_config:
