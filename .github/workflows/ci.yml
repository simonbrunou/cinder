name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ponytail: single version matched to dev; add a matrix here if you ever
      # support older Elixir/OTP than what you build on.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20"

      # Cache deps only — not _build — so a fresh compile each run can't pass on
      # stale beams (no incremental-compile false-greens).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-

      - run: mix deps.get

      # `mix test` is the project alias: compile --warnings-as-errors,
      # format --check-formatted, credo --strict, ecto create/migrate, test.
      #
      # #396: a flake sighting's failure detail is otherwise lost — a local `mix test --failed`
      # rerun can pass and clear the manifest before anyone captures the diff. `tee` keeps the
      # full output on disk regardless of exit status. We set `shell: bash` explicitly so GitHub
      # Actions applies `-o pipefail`, ensuring this step fails/succeeds on mix test's own exit
      # code, not tee's. The default shell (bash -e) lacks pipefail, which would mask failures.
      # The upload below preserves it as a downloadable artifact past whatever the job log's own
      # retention does.
      - shell: bash
        run: mix test 2>&1 | tee mix-test-output.log

      - name: Upload mix test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mix-test-output
          path: mix-test-output.log
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - run: mix deps.get
      # hex.audit = retired packages; deps.audit (mix_audit) = CVEs vs the Elixir
      # Security Advisory DB. Disjoint checks, keep both. deps.audit fails open if
      # it can't reach github.com to sync advisories — fine on hosted runners.
      - run: mix hex.audit
      - run: mix deps.audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build --check .
      - run: docker build -t cinder:ci .

      - name: Boot and exercise a fresh instance in a browser
        env:
          CINDER_SMOKE_BASE_URL: http://127.0.0.1:4000
          CINDER_SMOKE_EMAIL: browser-smoke@example.invalid
          CINDER_SMOKE_PASSWORD: ci-only-browser-smoke-password
          CINDER_SMOKE_BOOTSTRAP_TOKEN: ci-only-not-a-real-bootstrap-token
          CINDER_SMOKE_BROWSER_CHANNEL: chrome
        run: |
          docker run --detach --name cinder-ci -p 127.0.0.1:4000:4000 \
            -e SECRET_KEY_BASE=ci-only-not-a-real-secret-key-base-0123456789abcdefghijklmnopqrstuvwxyz \
            -e DATABASE_PATH=/data/cinder.db \
            -e PHX_HOST=127.0.0.1 \
            -e CINDER_BOOTSTRAP_TOKEN="$CINDER_SMOKE_BOOTSTRAP_TOKEN" \
            cinder:ci
          trap 'docker logs cinder-ci; docker rm --force cinder-ci' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready:-false}" = true

          # The browser smoke exercises account bootstrap, not external-service setup.
          docker exec cinder-ci /app/bin/cinder eval \
            '{:ok, _} = Application.ensure_all_started(:cinder); Cinder.Settings.mark_setup_complete()'

          browser_venv="$RUNNER_TEMP/cinder-browser-smoke"
          python3 -m venv "$browser_venv"
          "$browser_venv/bin/pip" install --disable-pip-version-check playwright==1.61.0
          "$browser_venv/bin/python" .github/scripts/browser_smoke.py

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cinder:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
