name: Release

# Build and publish the Docker image to GHCR on a version tag (e.g. v0.7.0).
# Layered on top of ci.yml (which tests every push/PR) — tag only green `main`.
# Multi-arch (linux/amd64 + linux/arm64) via QEMU-emulated buildx: neither base image
# (hexpm/elixir, debian) needs an architecture-specific pin, so the same Dockerfile
# cross-compiles for both.
#
# First release note: a new GHCR package is PRIVATE by default. After the first push,
# set the package visibility to Public (see CONTRIBUTING.md "Releasing") so a plain
# `docker compose up` can pull it.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/simonbrunou/cinder
          # v0.7.0 -> tags 0.7.0, 0.7, latest. `latest` is set explicitly so it
          # doesn't depend on the default-branch heuristic. Caveat: it follows the
          # most recently *pushed* tag — don't tag an older patch after a newer
          # release (or re-point latest by hand); metadata-action can't compare versions.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Includes org.opencontainers.image.source, which links the package to the repo.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
