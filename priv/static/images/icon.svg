<!-- Source of truth for the PWA/app icons. Same Ember Loop geometry as logo.svg on the dark
     theme's base-100. The mark stays inside the maskable safe zone, so this file serves both the
     plain and "maskable" manifest entries.

     Colors are the literal sRGB of the daisyUI dark-theme tokens in assets/css/app.css:
       #0B0C10 = the base-100 token, oklch(15.5% 0.008 265)
       #F38042 = the primary token,  oklch(72% 0.16 47)

     Regenerate the PNGs and favicon after editing:
       rsvg-convert -w 192 -h 192 priv/static/images/icon.svg -o priv/static/images/icon-192.png
       rsvg-convert -w 512 -h 512 priv/static/images/icon.svg -o priv/static/images/icon-512.png
       rsvg-convert -w 180 -h 180 priv/static/images/icon.svg -o priv/static/images/apple-touch-icon.png
       rsvg-convert -w 48 -h 48 priv/static/images/icon.svg -o /tmp/icon-48.png
       magick /tmp/icon-48.png -define icon:auto-resize=48,32,16 priv/static/favicon.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0B0C10"/>
  <g transform="translate(32 32) scale(7)">
    <path d="M43 17A19 19 0 1 0 43 47"
          fill="none"
          stroke="#F38042"
          stroke-width="8"
          stroke-linecap="round"/>
    <circle cx="53" cy="18" r="3.5" fill="#F38042"/>
    <path d="M28 22.8c-1.3-.8-3 .1-3 1.7v15c0 1.6 1.7 2.5 3 1.7l12-7.5c1.2-.8 1.2-2.6 0-3.4Z"
          fill="#F2F1EF"/>
  </g>
</svg>
